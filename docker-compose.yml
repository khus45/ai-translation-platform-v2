services:

  frontend:
    build:
      context: ./frontend

    container_name: ai_translation_frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: ai_translation_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: ai_translation_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translation_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

    container_name: ai_translation_redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest

    container_name: ai_translation_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    container_name: ai_translation_prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    container_name: ai_translation_grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  grafana_data:
